<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiceRoll</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header >

        <div>
        <img src="DiceRoll.png" alt="logo.png" id="logo.png" class="logo">
        </div>
        <div class="placeholder-div">
        <input type="text" placeholder="Kërko " id="placeholder" >
        </div>
            <nav class="navigationbar">
                        <a href="#Game-id"> Games</a>
                        <a href="#Help">Help</a>
            </nav>
        
        <div class="Login-div">
        <button id="Login-button"  onclick="location.href='login.html'" >Login </button>
        <button id="Register-button" onclick="location.href='register.html'">Register</button>
        </div>
    </header>
    <hr>
    <div class="slider" >
    <div class="slides">

        <div class="slide active" style="background-image: url(banner1.jpg);">
            <div class="slide-content" >
                <h1>Be a part of our HUGE giveaway!</h1>
                <p>Until 27.12.2025</p>
                <button>Join now</button>
            </div>
        </div>

        <div class="slide" style="background-image: url(banne2.jpg);">
            <div class="slide-content">
                <h1>Win big rewards</h1>
                <p>Over 100+ prizes</p>
                <button>Play now</button>
            </div>
        </div>

        <div class="slide" style="background-image: url(banner3.jpg);">
            <div class="slide-content">
                <h1>+5% first time deposit bonus</h1>
                <p>Fast and secure payouts</p>
                <button>Redeem</button>
            </div>
        </div>

    </div>

    <button class="arrow left" onclick="prevSlide()">❮</button>
    <button class="arrow right" onclick="nextSlide()">❯</button>

    <div class="dots">
        <span class="dot active" onclick="goToSlide(0)"></span>
        <span class="dot" onclick="goToSlide(1)"></span>
        <span class="dot" onclick="goToSlide(2)"></span>
    </div>
</div>


<script src="slider.js"></script>
</body>
</html>
